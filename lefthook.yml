# Lefthook - Git hooks manager (https://github.com/evilmartians/lefthook)
# Installed automatically via `pnpm prepare`. Skip once: git commit --no-verify.

# `piped`, not `parallel`, and the order matters: `oxlint --fix` and `prettier --write` REWRITE the
# files that `docs` then hashes. Run concurrently, the docs check can read a file prettier is about
# to change, pass, and leave a stale `.cairn/` stamp in the commit — which only surfaces at push,
# after the commit exists.
#
# Reproduced: hand-edit a markdown table with narrow column padding, `pnpm stamp`, then let prettier
# realign it. The stamp was made against the unformatted text and no longer matches. That cost two
# amend cycles in one session before the cause was found.
#
# The hook still only CHECKS. Stamping is where you assert a doc's claim about a source file is
# still true, so a hook that stamped for you would turn the gate into a reflex — the exact failure
# AGENTS.md records against re-stamping without reading the diff.
pre-commit:
  piped: true
  commands:
    # Prevent secrets from being committed
    gitleaks:
      priority: 1
      glob: '*.{js,cjs,mjs,ts,tsx,json,yaml,yml,env,sh}'
      run: gitleaks protect --staged --no-banner

    # Lint Dockerfiles
    hadolint:
      priority: 2
      glob: '**/Dockerfile*'
      run: hadolint {staged_files}

    # Lint + auto-fix TypeScript
    oxlint:
      priority: 3
      glob: '*.{js,cjs,mjs,ts,tsx}'
      run: pnpm oxlint --fix {staged_files} && git add {staged_files}
      stage_fixed: true

    # Format + auto-fix
    prettier:
      priority: 4
      glob: '*.{js,cjs,mjs,ts,tsx,json,md,yml,yaml,css,html}'
      run: pnpm prettier --write {staged_files} && git add {staged_files}
      stage_fixed: true

    # Docs: no dead links, every big file has a fresh stamped summary, and no doc claim about a
    # source file has silently gone stale. The glob covers *.ts too, because `--refs` drift is
    # caused by SOURCE edits — a docs-only glob would only notice at push time.
    docs:
      priority: 5
      glob: '*.{md,ts}'
      run: pnpm check

# Check-only mirror (no auto-fix), for running the same gates locally without the auto-fixing.
# NOT what CI runs — `.github/workflows/ci.yml` invokes the pnpm scripts directly, so a change here
# does not change what blocks a merge. Usage: lefthook run ci
ci:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks detect --no-banner
    hadolint:
      glob: '**/Dockerfile*'
      run: hadolint {all_files}
    oxlint:
      run: pnpm lint
    prettier:
      run: pnpm format:check
    docs:
      run: pnpm check

# The quality gate before code leaves your machine.
pre-push:
  piped: true
  commands:
    checks:
      priority: 1
      run: pnpm typecheck && pnpm test && pnpm build
    # Coverage ratchet. CI now runs this too (`pnpm coverage:ci`, with autoUpdate off), so this is
    # the fast local copy rather than the only place it is enforced. `autoUpdate` here lets the
    # committed numbers self-raise as coverage improves.
    coverage:
      priority: 3
      run: pnpm coverage
    # Mutation testing, on what THIS branch changed — and the only place it runs automatically, by
    # choice: a full run in CI costs about a minute per push for a signal whose value is in reading
    # the survivors. Line coverage says a line ran; it does not say a test would notice if that line
    # were wrong. The first full run scored 89.94% at 100% line coverage, and among the survivors
    # was every conjunct of `isRecord` — nothing fed it `null`, an array, or a non-object, so all
    # three guards could be deleted with the suite green.
    #
    # Scoped to changed files because a full run takes ~52s and, more importantly, because the score
    # that matters on a push is the score of the new code. `pnpm mutation:changed` exits 0 when the
    # branch touched no mutatable source.
    #
    # It cannot touch your working tree. Stryker must run `inPlace` here (sandbox mode crashes on
    # TypeScript 7 — see stryker.config.json), which overwrites real files, so the script runs it in
    # a throwaway `git worktree` of HEAD and discards it. A pre-push hook must not be able to damage
    # the work you are pushing.
    mutation:
      priority: 4
      run: pnpm mutation:changed
    docs:
      priority: 2
      run: pnpm check
