id: no-await
language: tsx
severity: error
message: 'await drops out of the Effect world: no typed error channel and no interruption. Compose with Effect.gen / Effect.flatMap, bridging at the edge with Effect.tryPromise.'
rule:
  kind: await_expression
files:
  - '**/*.{ts,tsx,mts,cts}'
ignores:
  - '**/*.test.{ts,tsx,mts,cts}'
  - '**/*.spec.{ts,tsx,mts,cts}'
  - '**/*.bench.{ts,tsx,mts,cts}'
