id: no-unsafe-api
language: tsx
severity: error
message: 'Effect marks a partial or throwing API with an Unsafe or OrThrow suffix — it is the escape hatch, not the API. Use the total counterpart (Context.get, Chunk.head, Result.getOrElse), which returns an Option, a Result or an Effect instead of throwing.'
note: |
  These are deliberate escape hatches, and the suffix is the warning label. `Chunk.headUnsafe`
  throws on an empty chunk where `Chunk.head` returns an Option; `Result.getOrThrow` throws where
  `Result.getOrElse` makes you say what happens instead.

  The namespace list is pinned rather than matching the suffix alone, because the suffix is a
  convention anyone may adopt: `myOwnHelper.readUnsafe(path)` is not this rule's business.

  Two things about that list you should know before trusting it.

  It is **hand-maintained**. Nothing verifies it; someone has to remember. It is correct as of
  effect 4.0.0-beta.102 — all 38 namespaces exist and each exports at least one such member, with
  none missing and none redundant — but that is a fact about today, not a property of the rule.

  It covers the **root import only**. 21 further risky APIs live in subpath modules that
  `import ... from 'effect'` does not re-export, and none of them is matched:
  `Cookies.makeCookieUnsafe`, `EventJournal.makeEntryIdUnsafe`, `AsyncResult.getOrThrow`,
  `WorkflowEngine.makeUnsafe` and others under `effect/unstable/*`. Widening the list to reach them
  would pull in names like `Headers` and `Worker`, which are ordinary identifiers in most
  codebases, so the gap is left open deliberately rather than traded for false positives.
rule:
  pattern: $NS.$METHOD($$$ARGS)
constraints:
  NS:
    regex: '^(Array|BigDecimal|BigInt|Chunk|Context|Cron|DateTime|Deferred|Duration|Effect|Equal|FiberHandle|FiberMap|FiberSet|HashMap|Iterable|Latch|Layer|Match|Metric|MutableList|Number|Option|PartitionedSemaphore|PubSub|Queue|Redacted|Ref|Result|Scope|ScopedRef|Semaphore|SubscriptionRef|SynchronizedRef|Trie|TxChunk|TxRef|UndefinedOr)$'
  METHOD:
    regex: '(Unsafe|OrThrow)$'
files:
  - '**/*.{ts,tsx}'
ignores:
  - '**/*.test.{ts,tsx}'
  - '**/*.spec.{ts,tsx}'
  - '**/*.bench.{ts,tsx}'
