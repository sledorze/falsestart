id: no-process-env
language: tsx
severity: error
message: 'Reading process.env directly makes configuration an untracked, untyped global. Declare it with Effect Config — Config.string("PORT") / Config.int("PORT") / Config.redacted("TOKEN") — so it is validated once, at startup, and visible in the type.'
rule:
  pattern: process.env
files:
  - '**/*.{ts,tsx,mts,cts}'
ignores:
  - '**/*.test.{ts,tsx,mts,cts}'
  - '**/*.spec.{ts,tsx,mts,cts}'
  - '**/*.bench.{ts,tsx,mts,cts}'
