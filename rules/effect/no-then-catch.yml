id: no-then-catch
language: tsx
severity: error
message: 'Promise chaining has no typed error channel and no interruption. Use Effect.map / Effect.catch / Effect.ensuring on an Effect.tryPromise instead.'
constraints:
  EXPR:
    not:
      # `Effect.catch(...)` is the remedy this rule recommends; matching it would block the fix.
      # Same for the other Effect namespaces that expose a `catch`/`finally`-shaped combinator.
      regex: '^(Effect|Stream|Layer|Fiber|Exit|Option|Result|Schedule|Sink|Channel)$'
rule:
  any:
    - pattern: $EXPR.then($$$ARGS)
    - pattern: $EXPR.catch($$$ARGS)
    - pattern: $EXPR.finally($$$ARGS)
files:
  - '**/*.{ts,tsx}'
ignores:
  - '**/*.test.{ts,tsx}'
  - '**/*.spec.{ts,tsx}'
