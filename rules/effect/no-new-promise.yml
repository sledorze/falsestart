id: no-new-promise
language: tsx
severity: error
message: 'A hand-rolled Promise has no typed error channel and cannot be interrupted. Use Effect.callback, or Effect.tryPromise at the boundary.'
rule:
  pattern: new Promise($$$ARGS)
files:
  - '**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}'
ignores:
  - '**/*.test.{ts,tsx,mts,cts,js,jsx,mjs,cjs}'
  - '**/*.spec.{ts,tsx,mts,cts,js,jsx,mjs,cjs}'
  - '**/*.bench.{ts,tsx,mts,cts,js,jsx,mjs,cjs}'
