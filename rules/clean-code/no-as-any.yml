id: no-as-any
language: tsx
severity: error
message: '`as any` erases the type rather than establishing it. Narrow with a type guard, or model the shape you actually have.'
rule:
  pattern: $X as any
files:
  - '**/*.{ts,tsx,mts,cts}'
ignores:
  - '**/*.test.{ts,tsx,mts,cts}'
  - '**/*.spec.{ts,tsx,mts,cts}'
  - '**/*.bench.{ts,tsx,mts,cts}'
