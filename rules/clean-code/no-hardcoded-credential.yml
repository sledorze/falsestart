id: no-hardcoded-credential
language: tsx
severity: error
message: 'This string literal has the shape of a real credential. Read it from configuration instead — a secret in source is in git history, in every clone, and in the build artifact, and rotating it is the only fix once it lands.'
note: |
  Matches the FORMAT of the credential, never the name of the variable holding it. That distinction
  is the whole design. A name-based rule — anything assigned to `password`, `apiKey`, `token` — fires
  on `const field = 'password'`, on a form label, on a test fixture, and on documentation about
  authentication; it is a content-pattern match wearing a security badge, and the noise gets it
  turned off. An issuer-assigned format is a structural fact about the value: `sk_live_…` is a Stripe
  secret key and nothing else is.

  So the trade is deliberate and worth stating plainly: this catches credentials that announce
  themselves and misses ones that do not. A bare `const password = 'hunter2'` is invisible to it,
  because nothing distinguishes that string from any other. It is a floor, not a boundary — pair it
  with a scanner over history, which is a different job from guarding one write.

  Test files are exempt, like every other rule here. A fixture full of realistic-looking keys is
  normal, and a rule that blocks writing one is a rule people disable.
rule:
  kind: string
  regex: '(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}|xox[baprs]-[0-9A-Za-z-]{12,}|sk_live_[0-9a-zA-Z]{24}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
files:
  - '**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}'
ignores:
  - '**/*.test.{ts,tsx,mts,cts,js,jsx,mjs,cjs}'
  - '**/*.spec.{ts,tsx,mts,cts,js,jsx,mjs,cjs}'
  - '**/*.bench.{ts,tsx,mts,cts,js,jsx,mjs,cjs}'
