id: no-double-cast
language: tsx
severity: error
message: 'Casting through `unknown` defeats every check the compiler would have made. Parse or validate the value instead.'
rule:
  pattern: $X as unknown as $T
files:
  - '**/*.{ts,tsx,mts,cts}'
ignores:
  - '**/*.test.{ts,tsx,mts,cts}'
  - '**/*.spec.{ts,tsx,mts,cts}'
  - '**/*.bench.{ts,tsx,mts,cts}'
