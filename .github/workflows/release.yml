name: Release

# Automated changesets flow (see AGENTS.md for the `pnpm changeset` convention).
#
# Gated on the `RELEASES_ENABLED` repository variable. UNDERSCORES, not hyphens: GitHub rejects
# `releases-enabled` with HTTP 422 — "Variable names can only contain alphanumeric characters or
# underscores" — so the original gate tested a variable that could never be created, and this job
# could never have run. It read as "deactivated pending a decision"; it was unreachable.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: github.repository == 'sledorze/falsestart' && vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - uses: changesets/action@v1.9.0
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          LEFTHOOK: 0
