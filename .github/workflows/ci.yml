name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Formatting was enforced only by a skippable local hook: `lefthook.yml`'s `ci:` block is
      # invoked by nothing, so `pnpm format:check` never ran anywhere that could block a merge.
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Dogfood: cairn checks this repo's own docs/ (summaries + dead links).
      - run: pnpm check
