name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Formatting was enforced only by a skippable local hook: `lefthook.yml`'s `ci:` block is
      # invoked by nothing, so `pnpm format:check` never ran anywhere that could block a merge.
      - run: pnpm format:check
      - run: pnpm typecheck
      # Coverage, not bare tests: the thresholds in vitest.config.ts were enforced only by the local
      # pre-push hook, which `git push --no-verify` skips. `autoUpdate` is off here — it exists so
      # the ratchet self-raises as coverage improves, and a CI run must measure against the
      # committed numbers rather than quietly rewrite them.
      - run: pnpm coverage:ci
      - run: pnpm build
      # Dogfood: cairn checks this repo's own docs/ (summaries + dead links).
      - run: pnpm check

  # A separate job so the fast checks are not queued behind it: mutation testing takes about a
  # minute, and lint or a stale doc stamp is what actually fails day to day. Both jobs are required
  # by branch protection, so nothing merges on the strength of the quick one alone.
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The repo-wide ratchet (break 88 in stryker.config.json). The pre-push hook mutates only
      # changed files against a low floor, because `--mutate <file>` scores the whole file — so
      # without this job the ratchet is enforced nowhere.
      - run: pnpm mutation
