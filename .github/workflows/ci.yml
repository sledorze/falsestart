name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: without this the default token carries write scope on every pull request, which a
# workflow that only reads the tree never needs. release.yml already did this; ci.yml did not.
permissions:
  contents: read

# A rapid second push should cancel the first rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `engines` claims >=22.13. Testing only one version made that an untested claim; 24 is the
        # version a new project will actually be on.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The deletions step below compares this branch against the pull request's base, which the
          # default depth of 1 does not fetch. Without history there is no base commit to diff, and
          # the step degrades into the same silent no-op it exists to fix.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Formatting was enforced only by a skippable local hook: `lefthook.yml`'s `ci:` block is
      # invoked by nothing, so `pnpm format:check` never ran anywhere that could block a merge.
      - run: pnpm format:check
      - run: pnpm typecheck
      # Coverage, not bare tests: the thresholds in vitest.config.ts were enforced only by the local
      # pre-push hook, which `git push --no-verify` skips. `autoUpdate` is off here — it exists so
      # the ratchet self-raises as coverage improves, and a CI run must measure against the
      # committed numbers rather than quietly rewrite them.
      - run: pnpm coverage:ci
      - run: pnpm build
      # Dogfood: cairn checks this repo's own docs/ (summaries + dead links).
      - run: pnpm check
      # `pnpm check` passes `--report-deletions` with cairn's default `--deletions-since HEAD`,
      # which compares the WORKING TREE against HEAD. On a CI checkout everything is committed, so
      # it inspects nothing and prints `Nothing deleted since the compared ref — nothing to check.`
      # on every run. It has therefore never reported a deletion here, on any pull request, since
      # the flag was wired in — the deletions this repo cares about are the ones already committed
      # on the branch, and only a comparison against the base can see them.
      #
      # Verified before and after, with the deletion COMMITTED and the tree clean: the default ref
      # prints `nothing to check`, while `--deletions-since origin/main` reports
      # `1 deleted doc(s) took content with them` / `heading nowhere else: # Overview`.
      #
      # This step CANNOT fail the build on a deletion: `--report-deletions` is informational and
      # never affects cairn's exit code (it does still exit non-zero on a broken link or a stale
      # summary, which `pnpm check` above has already covered). Its job is to put a lossy deletion
      # in the pull request's log where a reviewer sees it, not to gate the merge — and it is
      # written as its own step, rather than folded into `pnpm check`, so that `pnpm verify` locally
      # and CI keep running the identical command.
      # The base branch, fetched explicitly for the same reason the mutation job does it: this
      # step's whole value depends on the base existing, and a missing one degrades into the silent
      # no-op it was written to remove rather than failing loudly.
      - if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin +refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
      - if: github.event_name == 'pull_request'
        name: Report deletions against the pull request base
        run: npx cairn check --report-deletions --deletions-since "origin/${{ github.base_ref }}"

  # Mutation testing on what the pull request changed — the only mechanism here that notices a test
  # which cannot fail. `pnpm coverage:ci` above proves a line RAN; it never proves a test would
  # object if that line were wrong, and both are green on an assertion about something the
  # implementation does not control. Until this job existed the check ran nowhere a merge could see:
  # `lefthook.yml`'s pre-push is skipped by `git push --no-verify`, by `LEFTHOOK=0`, by a clone where
  # `pnpm install` never ran the `prepare` script, and by every merge performed in the GitHub UI.
  #
  # Blocking, deliberately. It costs roughly a minute per changed source file on top of a ~1 minute
  # install, and scores the WHOLE of each changed file rather than the diff, against a floor of 70
  # (see scripts/mutate-changed.sh). A pull request touching many source files is correspondingly
  # slower; that is the price of the signal, and `timeout-minutes` bounds the worst case rather than
  # hiding it.
  #
  # ONE MANUAL STEP, without which this job blocks nothing: adding a job does not make it a required
  # status check. Until `mutation` is in this repository's branch-protection rules, it reports and a
  # merge can proceed past it — and `dependabot-auto-merge.yml` merges as soon as the checks that
  # ARE required pass. Branch protection lives outside the repository, so nothing here can assert it.
  #
  # Two things it does not reach, both by design and neither obvious: `src/cli.ts` is excluded (from
  # the script and from stryker.config.json's `mutate`), and a branch whose only changed test has no
  # sibling implementation — `cli.e2e.test.ts`, `corpus.test.ts`, this file's own `guards.test.ts` —
  # has nothing for `--mutate` to score and skips.
  mutation:
    # Pull requests only. On a push to `main` the merge-base with `origin/main` is HEAD itself, the
    # diff is empty, and the job would report success having scored nothing.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The default depth of 1 leaves no `origin/main` and no merge-base, which is precisely the
          # state in which the script's own fallback is `exit 0`. Without full history this job would
          # pass on every pull request without mutating a single file.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          # One version, not the matrix: mutation score is a property of the tests, not of the
          # runtime, and paying for it twice buys nothing.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Belt and braces: `fetch-depth: 0` is documented to create the remote-tracking branches, but
      # this job's whole value depends on the base branch existing, so it is fetched explicitly
      # rather than assumed. Cheap, and it fails loudly here rather than degrading into a silent
      # skip.
      - run: git fetch --no-tags origin +refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
      # MUTATION_REQUIRE_BASE turns "no base to compare against" from a skip into a failure. Without
      # it, every way this job could lose its history — a shallow clone, a fetch that did not run, a
      # renamed default branch — is reported as a pass.
      #
      # MUTATION_BASE_REF is the branch this pull request is merging into, which is not always
      # `main`: AGENTS.md prescribes stacking a dependent branch on its prerequisite, and diffing
      # such a branch against `main` scores the prerequisite's files too.
      - run: pnpm mutation:changed
        env:
          MUTATION_REQUIRE_BASE: '1'
          MUTATION_BASE_REF: ${{ github.base_ref }}
