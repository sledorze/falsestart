name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

jobs:
  analyze:
    # Gated like the release job, and for the same kind of reason: uploading results needs GitHub
    # Advanced Security, which is not enabled here. Without it every run fails at the upload step
    # with "Resource not accessible by integration", which makes `main` permanently red and trains
    # everyone to ignore a red main — worse than not running the scan. Flip `vars.CODEQL_ENABLED`
    # to 'true' once Advanced Security is on.
    if: vars.CODEQL_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.37.4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4.37.4
